<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three Properties — Uganda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Fraunces:opsz,wght@9..144,400;9..144,500&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: #10100e;
      color: #f4efe6;
      font-family: "DM Sans", sans-serif;
    }
    .hero {
      min-height: 100vh;
      display: grid;
      place-items: end start;
      padding: 0 48px 90px;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(16,16,14,.2), rgba(16,16,14,.75)),
        url("website/img/hero-3.jpg") center / cover no-repeat,
        #10100e;
    }
    .inner { position: relative; z-index: 2; max-width: 1100px; }
    .welcome {
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 13px;
      margin-bottom: 10px;
      animation: rise 1s ease both;
    }
    h1 {
      font-family: "Fraunces", serif;
      font-weight: 400;
      font-size: clamp(52px, 10vw, 112px);
      line-height: 0.92;
      animation: rise 1.1s .08s ease both;
    }
    .lead {
      margin-top: 18px;
      max-width: 520px;
      color: rgba(244,239,230,.75);
      animation: rise 1.1s .16s ease both;
    }
    .cta {
      display: inline-block;
      margin-top: 32px;
      padding: 12px 22px;
      border: 1px solid rgba(244,239,230,.7);
      color: #f4efe6;
      text-decoration: none;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-size: 11px;
      animation: rise 1.1s .24s ease both;
      transition: .3s ease;
    }
    .cta:hover { background: #f4efe6; color: #10100e; }
    @keyframes rise { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
    @media (max-width: 700px) { .hero { padding: 0 20px 64px; } }
  </style>
</head>
<body>
  <header class="hero">
    <div class="inner">
      <p class="welcome">Welcome to</p>
      <h1>Three Properties</h1>
      <p class="lead">Hotel Samara · Lodge Emburara · Lodge Chimpundu — a live demo of the website and staff software.</p>
      <a class="cta" href="website/index.html">View website</a>
    </div>
  </header>
</body>
</html>
